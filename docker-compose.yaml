services:
  mariadb:
    image: mariadb:10.6
    container_name: orangehrm-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: orangehrm
      MYSQL_USER: orangehrm
      MYSQL_PASSWORD: orangehrm123
    volumes:
      - mariadb_data:/var/lib/mysql

  orangehrm:
    image: koushiksiripuram/orangehrm:latest
    container_name: orangehrm
    restart: always
    ports:
      - "8080:80"
    environment:
      ORANGEHRM_DATABASE_HOST: mariadb
      ORANGEHRM_DATABASE_PORT: 3306
      ORANGEHRM_DATABASE_USER: orangehrm
      ORANGEHRM_DATABASE_PASSWORD: orangehrm123
      ORANGEHRM_DATABASE_NAME: orangehrm
    depends_on:
      - mariadb

volumes:
  mariadb_data: